title: Rick's presentation
author: Rick Lupton
version: 1.3.0
quarto-required: ">=1.9.18"
contributes:
  formats:
    revealjs:
      theme: [default, rick.scss]
      logo: uob-logo-grey-transparent.png
      footer: |
        Dr Rick Lupton, University of Bath
      title-slide-attributes:
        data-background-image: uob-logo-grey-transparent.png
        data-background-size: initial
        data-background-position: 50% 90%
      preview-links: auto
      # Maths is typeset at render time by the embedded katex-prerender
      # extension (_extensions/ricklupton/katex-prerender), so a deck needs
      # no KaTeX JavaScript and, with `embed-resources: true`, is one file
      # with its maths.  The method must still be named: at the revealjs
      # default, Quarto adds reveal.js's MathJax plugin, which loads MathJax
      # from a CDN.
      html-math-method: katex
      filters:
        - prep-svg.lua
        - katex-prerender
